# Source: The Consultant and the Machine -- Chapter 13
# Pattern: Framework control mappings (ISO/ENS/NIS2)

# frameworks/iso27001_2022.yaml
framework: ISO27001
version: "2022"
controls:
  - id: "A.5.1"
    title: "Information security policies"
    category: "Organizational"
    description: >
      A set of security policies must be defined,
      approved by management, published, and communicated.
    cross_references:
      - "ENS:org.1"
      - "NIS2:Art.21.2.a"

  - id: "A.8.8"
    title: "Technical vulnerability management"
    category: "Technological"
    description: >
      Data on technical vulnerabilities must be obtained,
      exposure evaluated, and timely measures taken.
    cross_references:
      - "ENS:op.exp.4"
      - "NIS2:Art.21.2.e"
