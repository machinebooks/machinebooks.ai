# PQC-Day and the Machine — Chapter 21
# Pattern: Nginx reverse proxy configuration for PQC Platform
#
# This is a didactic example from the book, not production code.
# See chapter 21 for full context and explanation.

# Upstream: backend Flask
upstream backend {
    server pqc_backend:5000;
}

# Upstream: frontend Vite (development)
upstream frontend {
    server pqc_frontend:3000;
}

server {
    listen 8080;
    server_name _;

    # --- Limits and buffers ---
    client_max_body_size 50M;          # Large repos uploaded as ZIP
    proxy_buffer_size 16k;
    proxy_buffers 4 32k;

    # --- Security headers ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security
               "max-age=31536000; includeSubDomains" always;

    # --- API: proxy to Flask backend ---
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 120s timeout for slow analysis endpoints
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # --- WebSocket: Vite HMR (development only) ---
    location /ws {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;

        # Long timeout to keep WS connection open
        proxy_read_timeout 86400s;     # 24 hours
        proxy_send_timeout 86400s;
    }

    # --- Frontend: everything else ---
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # --- Nginx healthcheck ---
    location /health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
