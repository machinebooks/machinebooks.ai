# Source: The DevSecOps and the Machine -- Chapter 5
# Pattern: Dependency policy as code

# .github/dependency-policy.yml
# Project dependency policy
policy:
  version: "1.0"

  licenses:
    allowed:
      - MIT
      - Apache-2.0
      - BSD-2-Clause
      - BSD-3-Clause
      - ISC
      - PSF-2.0
    blocked:
      - AGPL-3.0-only
      - AGPL-3.0-or-later
      - GPL-3.0-only      # Unless approved exception
      - SSPL-1.0
    review_required:
      - GPL-2.0-only
      - LGPL-2.1-only
      - MPL-2.0

  vulnerabilities:
    block_on:
      - severity: critical
        max_age_days: 0    # Immediate block
      - severity: high
        max_age_days: 7    # 7 days to patch
    warn_on:
      - severity: medium
        max_age_days: 30

  supply_chain:
    require_known_license: true
    max_transitive_depth: 5   # Alert if a dep has >5 levels
    block_deprecated: true     # Block deprecated packages