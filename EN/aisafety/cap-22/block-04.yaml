# Extracted from: LibroAISafety/ch-22-secure-architecture.md
# Prometheus alerting rules for AI security
groups:
  - name: ai_security
    rules:
      - alert: HighInjectionAttempts
        expr: rate(ai_injection_blocked_total[5m]) > 10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Elevated rate of blocked injection attempts"

      - alert: GuardrailBypassDetected
        expr: ai_guardrail_bypass_total > 0
        for: 0m    # immediate alert
        labels:
          severity: critical
        annotations:
          summary: "Guardrail bypass detected -- review immediately"

      - alert: AnomalousToolUsage
        expr: >
          ai_tool_calls_total{tool="query_database"}
          / ai_sessions_total > 15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Anomalous tool usage per session"
