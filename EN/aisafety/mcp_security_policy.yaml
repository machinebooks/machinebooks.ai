# mcp_security_policy.yaml — Security policy for MCP servers
mcp_servers:
  approval:
    required: true
    process: "The AI Safety Engineer evaluates the server before installation"
    criteria:
      - "Source code available and reviewable"
      - "Identifiable author or organization"
      - "Last update < 6 months"
      - "No access to sensitive data without justification"

  isolation:
    network: "Each MCP server in its own network namespace"
    filesystem: "Access only to declared and approved paths"
    credentials: "Credentials managed by the client, not the server"

  monitoring:
    logging: "Log every tool invocation with parameters"
    alerts:
      - "Tool invoked with parameters containing sensitive paths"
      - "Tool sending data to undeclared endpoints"
      - "Server registering tools with colliding names"

  revocation:
    immediate: "The user can disconnect a server without restarting"
    automatic: "Servers generating alerts are automatically disconnected"
