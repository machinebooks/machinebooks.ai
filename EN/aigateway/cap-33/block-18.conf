# nginx-azure.conf — Azure-specific headers
proxy_set_header X-Azure-Sitename       $http_x_azure_sitename;
proxy_set_header X-AppService-Proto      $http_x_appservice_proto;
proxy_set_header X-Forwarded-Tls         $http_x_forwarded_tls;
proxy_set_header traceparent             $http_traceparent;
proxy_set_header tracestate              $http_tracestate;
