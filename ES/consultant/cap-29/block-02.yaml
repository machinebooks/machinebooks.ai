# Extraído de: LibroConsultor/cap-29-futuro-consultor.md
# Ejemplo: sistema de decisión continua para gestión de costes cloud
# Diseñado por consultor, operado por el cliente
sistema_decision:
  nombre: "Monitor de costes cloud - Entidad Financiera"
  version: "2.1"

  fuentes_datos:
    - tipo: "aws_cost_explorer"
      frecuencia: "diaria"
      granularidad: "servicio"
    - tipo: "azure_cost_management"
      frecuencia: "diaria"
      granularidad: "resource_group"
    - tipo: "presupuestos_internos"
      frecuencia: "mensual"
      fuente: "erp_cliente"

  agentes:
    - nombre: "detector_anomalias"
      modelo: "claude-haiku-4-5"  # Bajo coste para alta frecuencia
      frecuencia: "cada_6_horas"
      umbral_alerta: "desviacion > 15% vs media_30_dias"
      accion: "notificar_equipo_finops"

    - nombre: "analizador_tendencias"
      modelo: "claude-sonnet-4-6"
      frecuencia: "semanal"
      output: "informe_tendencias_con_recomendaciones"
      accion: "enviar_a_cfo + consultor_revisar"

    - nombre: "optimizador_rightsizing"
      modelo: "claude-sonnet-4-6"
      frecuencia: "quincenal"
      input: "metricas_utilizacion_recursos"
      output: "recomendaciones_rightsizing_priorizadas"
      accion: "crear_tickets_en_jira"

  decisiones_automaticas:  # Sin intervención humana
    - "alertar si gasto diario > 120% del presupuesto"
    - "pausar entornos de desarrollo fuera de horario laboral"
    - "archivar snapshots > 90 dias sin acceso"

  decisiones_humanas:  # Requieren consultor o cliente
    - "cambiar de instancia reservada a bajo demanda"
    - "migrar servicio entre proveedores cloud"
    - "renegociar compromisos anuales"
    - "aprobar inversiones > €10.000"

  recalibracion:
    frecuencia: "trimestral"
    responsable: "consultor_senior"
    metricas_eficacia:
      - "falsos_positivos_por_mes"
      - "tiempo_medio_deteccion_anomalia"
      - "ahorro_mensual_atribuible"
      - "satisfaccion_equipo_cliente"
