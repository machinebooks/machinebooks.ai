# prometheus.yml - Configuración de scraping
global:
  scrape_interval: 15s          # Frecuencia de recolección
  evaluation_interval: 15s      # Frecuencia de evaluación de reglas

scrape_configs:
  - job_name: "grc-backend"
    static_configs:
      - targets: ["backend:8000"]
        labels:
          service: "backend"
          environment: "production"

  - job_name: "grc-ai-service"
    static_configs:
      - targets: ["ai-service:8001"]
        labels:
          service: "ai-service"
          environment: "production"

  - job_name: "grc-celery-exporter"
    static_configs:
      - targets: ["celery-exporter:9808"]
        labels:
          service: "celery"
          environment: "production"

# Reglas de alerta para compliance
rule_files:
  - "alert_rules.yml"
