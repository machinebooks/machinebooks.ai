# Extraído de: LibroCyberrange/cap-05-arquitectura.md
# Ejemplo didáctico: docker-compose.yml
# Stack completo del Cyber Range (4 servicios)

services:
  # Frontend React (build + Nginx como proxy)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-15173}:80"
    depends_on:
      - backend
    networks:
      - cyberrange_net

  # Backend FastAPI (35 routers, 25+ servicios)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy   # Esperar a que MySQL esté listo
      redis:
        condition: service_healthy   # Esperar a que Redis responda
    networks:
      - cyberrange_net

  # Base de datos MySQL 8.0
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cyberrange_net

  # Redis 7 (broker Celery + caché)
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cyberrange_net

volumes:
  mysql_data:
  redis_data:
  uploads_data:

networks:
  cyberrange_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.99.0/24   # Red dedicada, aislada
