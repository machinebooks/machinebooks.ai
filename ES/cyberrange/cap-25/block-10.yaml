# Extraído de: LibroCyberrange/cap-25-despliegue-produccion.md
# Ejemplo didáctico: patrones/docker/cyber-range-compose-prod.yml
services:
  backend:
    ports:
      - "${BACKEND_PORT:-18000}:8000"
    volumes:
      - cyberrange_uploads_data:/app/uploads
      - cyberrange_playbooks_data:/app/backend/data/playbooks   # Persistencia de playbooks

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A backend.celery_app worker --loglevel=info
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-localhost}
        VITE_API_PROTOCOL: ${VITE_API_PROTOCOL:-https}

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-10080}:80"
      - "${HTTPS_PORT:-10443}:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/templates/default.conf.template:ro
      - ./certs:/etc/nginx/certs:ro         # Certificados SSL
    environment:
      PROXMOX_PROXY_TARGET: ${PROXMOX_PROXY_TARGET}
    depends_on:
      - backend
      - frontend

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    profiles:
      - local-ai                            # Solo se levanta con --profile local-ai
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - cyberrange_ollama_data:/root/.ollama
