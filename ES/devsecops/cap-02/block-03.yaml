# Extraído de: LibroDevSecOps/cap-02-anatomia-vulnerabilidad.md
rules:
  - id: python-sql-injection-format-string
    patterns:
      - pattern: |
          $CURSOR.execute(f"...{$VAR}...")
      - pattern-not: |
          $CURSOR.execute(f"...{$CONST}...", ...)
    message: >
      Posible inyección SQL: se usa un f-string para construir la consulta
      pasada a cursor.execute(). Un atacante puede manipular el valor de
      la variable interpolada para alterar la consulta SQL.
      Usa consultas parametrizadas: cursor.execute("SELECT ... WHERE col = ?", (valor,))
    severity: ERROR
    languages: [python]
    metadata:
      cwe:
        - "CWE-89: Improper Neutralization of Special Elements used in an SQL Command"
      owasp:
        - "A03:2021 - Injection"
      confidence: HIGH
      impact: HIGH
      references:
        - https://owasp.org/Top10/A03_2021-Injection/
