# Extraído de: LibroDevSecOps/cap-07-contenedores.md
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-non-root
spec:
  validationFailureAction: Enforce
  rules:
    - name: check-non-root
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Los contenedores deben ejecutarse como non-root"
        pattern:
          spec:
            containers:
              - securityContext:
                  runAsNonRoot: true
