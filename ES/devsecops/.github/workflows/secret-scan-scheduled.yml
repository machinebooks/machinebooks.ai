# Extraído de: LibroDevSecOps/cap-06-secretos.md
# .github/workflows/secret-scan-scheduled.yml
name: Secret Scan — Monitorización continua
on:
  schedule:
    - cron: '0 3 * * *'  # Todos los días a las 3:00 UTC
  workflow_dispatch:       # Permite ejecución manual

jobs:
  full-scan:
    name: "Escaneo completo del repositorio"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks — historial completo
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --report-format json --report-path gitleaks-report.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
      - name: TruffleHog — verificación completa
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: >-
            --only-verified
            --json
            --results=verified
      - name: Notificar hallazgos
        if: failure()
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "Secret scan nocturno: se detectaron secretos en el repositorio. Revisar hallazgos en GitHub Actions."
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
