# .github/workflows/secret-scanning.yml
name: Secret Scanning
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

jobs:
  gitleaks:
    name: "Gitleaks — detección rápida"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Historial completo para escaneo de commits
      - name: Ejecutar Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  trufflehog:
    name: "TruffleHog — verificación activa"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ejecutar TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          # Escanea solo los commits nuevos de la PR
          extra_args: >-
            --only-verified
            --results=verified,unknown
            --fail
