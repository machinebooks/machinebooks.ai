# .github/workflows/security-pipeline.yml
name: Security Pipeline

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write        # Para comentar en la PR
  security-events: write      # Para publicar resultados SARIF

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true    # Cancela ejecuciones previas de la misma PR

env:
  GRYPE_DB_CACHE_DIR: /tmp/grype-db
  TRIVY_DB_CACHE_DIR: /tmp/trivy-db
  IMAGE_NAME: app-devsecops
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ── Job 1: SAST con Semgrep ──────────────────────
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Semgrep rules
        uses: actions/cache@v4
        with:
          path: ~/.semgrep
          key: semgrep-rules-${{ hashFiles('.semgrep.yml') }}

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/default
            p/owasp-top-ten
            p/python
            .semgrep/custom-rules.yml
          generateSarif: true

      - name: Export results as JSON
        run: |
          semgrep --config p/default --config .semgrep/custom-rules.yml \
            --json --output sast-results.json .

      - name: Upload SAST results
        uses: actions/upload-artifact@v4
        with:
          name: sast-results
          path: sast-results.json
          retention-days: 30

  # ── Job 2: SCA con Syft + Grype ──────────────────
  sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Grype DB
        uses: actions/cache@v4
        with:
          path: ${{ env.GRYPE_DB_CACHE_DIR }}
          key: grype-db-${{ github.run_id }}
          restore-keys: grype-db-

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          output-file: sbom.json

      - name: Scan SBOM with Grype
        run: |
          grype sbom:sbom.json \
            --output json \
            --file sca-results.json \
            --db-cache-dir ${{ env.GRYPE_DB_CACHE_DIR }}

      - name: Upload SCA results
        uses: actions/upload-artifact@v4
        with:
          name: sca-results
          path: |
            sbom.json
            sca-results.json
          retention-days: 30

  # ── Job 3: Secret scanning con Gitleaks ──────────
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Historial completo para escanear commits

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          args: >-
            detect
            --source .
            --report-format json
            --report-path secrets-results.json
            --log-level warn
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Upload secrets results
        uses: actions/upload-artifact@v4
        if: always()    # Sube incluso si Gitleaks falla (hallazgo = exit 1)
        with:
          name: secrets-results
          path: secrets-results.json
          retention-days: 30

  # ── Job 4: Build de imagen Docker ────────────────
  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: docker-${{ hashFiles('Dockerfile', 'requirements.txt') }}
          restore-keys: docker-

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Save image as tarball
        run: |
          docker save ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            -o /tmp/image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/image.tar
          retention-days: 1

      # Rota la cache para evitar crecimiento indefinido
      - name: Rotate cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  # ── Job 5: Container scan con Trivy ──────────────
  container-scan:
    runs-on: ubuntu-latest
    needs: [build-image]      # Espera a que la imagen esté construida
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load image
        run: docker load -i /tmp/image.tar

      - name: Cache Trivy DB
        uses: actions/cache@v4
        with:
          path: ${{ env.TRIVY_DB_CACHE_DIR }}
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-

      - name: Run Trivy
        run: |
          trivy image \
            --format json \
            --output container-results.json \
            --cache-dir ${{ env.TRIVY_DB_CACHE_DIR }} \
            --severity HIGH,CRITICAL \
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Upload container results
        uses: actions/upload-artifact@v4
        with:
          name: container-results
          path: container-results.json
          retention-days: 30

  # ── Job 6: Agregación y gate de seguridad ────────
  security-gate:
    runs-on: ubuntu-latest
    needs: [sast, sca, secrets, container-scan]
    if: always()              # Se ejecuta aunque algún job falle
    steps:
      - uses: actions/checkout@v4

      - name: Download all results
        uses: actions/download-artifact@v4
        with:
          path: /tmp/security-results

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install aggregator dependencies
        run: pip install anthropic

      - name: Run security aggregator
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python scripts/security_aggregator.py \
            --results-dir /tmp/security-results \
            --output /tmp/gate-report.json

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(
              fs.readFileSync('/tmp/gate-report.json', 'utf8')
            );
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: report.pr_comment
            });

      - name: Enforce gate
        run: |
          python -c "
          import json, sys
          report = json.load(open('/tmp/gate-report.json'))
          if report['gate_decision'] == 'block':
              print('::error::Security gate BLOCKED the merge.')
              print(report['block_reason'])
              sys.exit(1)
          elif report['gate_decision'] == 'warn':
              print('::warning::Security gate found issues requiring review.')
          else:
              print('Security gate: PASSED')
          "

      - name: Upload gate report
        uses: actions/upload-artifact@v4
        with:
          name: security-gate-report
          path: /tmp/gate-report.json
          retention-days: 90
