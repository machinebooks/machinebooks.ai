# docker-compose.yml — etiquetas de FinOps en los servicios
services:
  api:
    image: plataforma-api:latest
    labels:
      - "finops.environment=prod"
      - "finops.team=backend"
      - "finops.service=api"
      - "finops.cost-center=CC-PLATAFORMA"

  ai-service:
    image: plataforma-ai:latest
    labels:
      - "finops.environment=prod"
      - "finops.team=backend"
      - "finops.service=ai-service"
      - "finops.cost-center=CC-PLATAFORMA"

  qdrant:
    image: qdrant/qdrant:latest
    labels:
      - "finops.environment=prod"
      - "finops.team=platform"
      - "finops.service=vector-db"
      - "finops.cost-center=CC-INFRA"
