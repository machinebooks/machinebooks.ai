# Extraído de: LibroTecnico/cap-20-docker.md
# Ejemplo didáctico: patrones/docker/selenium-grid.yml
  selenium_hub:
    image: selenium/hub:4.27
    container_name: plataforma_selenium_hub
    ports:
      - "127.0.0.1:4442:4442"   # Publisher port — bind a localhost, no exponer al exterior
      - "127.0.0.1:4443:4443"   # Subscriber port — bind a localhost, no exponer al exterior
      - "127.0.0.1:4444:4444"   # Hub WebDriver API — bind a localhost, no exponer al exterior
    environment:
      - SE_NODE_MAX_SESSIONS=3
      - SE_SESSION_QUEUE_TIMEOUT=300  # 5 minutos máximo en cola
    networks:
      - plataforma_backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4444/wd/hub/status"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  selenium_node_1:
    image: selenium/node-chrome:4.27
    container_name: plataforma_selenium_node_1
    shm_size: '2gb'       # CRÍTICO: Chrome necesita memoria compartida para renderizar
    environment:
      - SE_EVENT_BUS_HOST=selenium_hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=1
      - SE_NODE_SESSION_TIMEOUT=300
      # Opciones Chrome para entornos headless corporativos
      - SE_OPTS=--log-level WARNING
    depends_on:
      selenium_hub:
        condition: service_healthy
    networks:
      - plataforma_backend
    deploy:
      resources:
        limits:
          memory: 1.5G    # Chrome consume mucho al cargar aplicaciones SPA
          cpus: '1.0'
